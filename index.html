<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動物配對消除 - 免費線上小遊戲</title>
    <meta name="description" content="免費好玩的動物配對消除遊戲!挑戰三種模式,衝刺排行榜,支援鍵盤操作。立即開始遊玩!">
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6840520691227023" crossorigin="anonymous"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .mode-btn {
            flex: 1;
            padding: 15px 10px;
            border: 2px solid #667eea;
            background: white;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .mode-btn:hover {
            transform: translateY(-2px);
        }
        
        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .mode-info {
            background: #fff3cd;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #856404;
            margin-bottom: 15px;
            text-align: center;
            line-height: 1.4;
        }
        
        .mode-info strong {
            display: block;
            margin-bottom: 5px;
            font-size: 15px;
        }
        
        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: #f7f7f7;
            border-radius: 10px;
        }
        
        .score-item {
            text-align: center;
        }
        
        .score-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .score-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        
        .score-value.combo-active {
            color: #f5576c;
            animation: pulse 0.5s ease;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        .combo-multiplier {
            font-size: 14px;
            color: #f5576c;
            font-weight: bold;
            margin-top: 5px;
        }
        
        .score-value.timer {
            color: #f5576c;
        }
        
        .warning-box {
            background: #ff6b6b;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
            min-height: 280px;
        }
        
        .tile {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            padding: 0;
        }
        
        .tile:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.2);
        }
        
        .tile:focus {
            outline: 3px solid #f5576c;
            outline-offset: -3px;
        }
        
        .tile.selected {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            transform: scale(0.95);
        }
        
        .tile.matched {
            background: #4CAF50;
            animation: match 0.5s ease;
        }
        
        .tile.bomb {
            background: linear-gradient(135deg, #ff4757 0%, #d63031 100%);
            animation: bombPulse 1s infinite;
        }
        
        @keyframes bombPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        @keyframes match {
            0% { transform: scale(1); }
            50% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(0); opacity: 0; }
        }
        
        .controls {
            display: flex;
            gap: 10px;
        }
        
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-new-game {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-new-game:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-leaderboard {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-content h2 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 20px;
        }
        
        .final-score {
            font-size: 48px;
            font-weight: bold;
            color: #f5576c;
            margin: 20px 0;
        }
        
        .name-input-section {
            margin: 20px 0;
            padding: 20px;
            background: #f7f7f7;
            border-radius: 10px;
        }
        
        .name-input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #667eea;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        
        .submit-score-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .leaderboard-table {
            width: 100%;
            margin: 20px 0;
            border-collapse: collapse;
        }
        
        .leaderboard-table th,
        .leaderboard-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .leaderboard-table th {
            background: #667eea;
            color: white;
        }
        
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #f7f7f7;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .tab-btn.active {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🎮 動物配對挑戰</h1>
        </div>
        
        <div class="mode-selector">
            <button class="mode-btn active" onclick="selectMode('classic')">♾️ 經典</button>
            <button class="mode-btn" onclick="selectMode('score')">🎯 1000分</button>
            <button class="mode-btn" onclick="selectMode('time')">⏱️ 2分鐘</button>
        </div>
        
        <div class="mode-info" id="modeInfo">
            <strong>經典模式</strong>
            消除鄰近相同動物!沒有可消除時自動洗牌+500分<br>
            <small>⚠️ COMBO每4次出現1顆炸彈! 踩到直接結束!</small>
        </div>
        
        <div id="warningBox" style="display:none;" class="warning-box">
            ⚠️ 場上有炸彈! 小心別踩到! 💣
        </div>
        
        <div class="score-board">
            <div class="score-item">
                <div class="score-label">分數</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">連擊</div>
                <div class="score-value" id="extraValue">0</div>
                <div class="combo-multiplier" id="comboMultiplier"></div>
            </div>
            <div class="score-item">
                <div class="score-label">移動</div>
                <div class="score-value" id="moves">0</div>
            </div>
        </div>
        
        <div class="grid" id="grid"></div>
        
        <div class="controls">
            <button class="btn-new-game" onclick="newGame()">🔄 新遊戲</button>
            <button class="btn-leaderboard" onclick="showLeaderboard()">🏆 排行榜</button>
        </div>
    </div>
    
    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2 id="gameOverTitle">🎉 遊戲結束!</h2>
            <div class="final-score" id="finalScore">0</div>
            <p id="gameOverStats"></p>
            <div class="name-input-section" id="nameInputSection" style="display:none;">
                <h3>🌟 恭喜進入前20名!</h3>
                <input type="text" class="name-input" id="playerName" placeholder="輸入你的名字" maxlength="10">
                <button class="submit-score-btn" onclick="submitScore()">提交分數</button>
            </div>
            <button class="btn-new-game" onclick="closeGameOver()">再玩一次</button>
        </div>
    </div>
    
    <div class="modal" id="leaderboardModal">
        <div class="modal-content">
            <h2>🏆 排行榜</h2>
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchLeaderboard('classic')">經典</button>
                <button class="tab-btn" onclick="switchLeaderboard('score')">1000分</button>
                <button class="tab-btn" onclick="switchLeaderboard('time')">2分鐘</button>
            </div>
            <div id="leaderboardContent"></div>
            <button class="btn-new-game" onclick="closeLeaderboard()">關閉</button>
        </div>
    </div>

    <script>
        var score = 0, combo = 0, maxCombo = 0, moves = 0;
        var selectedTile = null, tiles = [], canClick = true;
        var gameMode = 'classic', timer = 0, timerInterval = null;
        var startTime = 0, lastMatchTime = 0, comboTimeout = null;
        var bombPositions = [], matchCountSinceBomb = 0;
        var GRID_SIZE = 16, TIME_LIMIT = 120, SCORE_TARGET = 1000, COMBO_TIME_LIMIT = 2000;
        var ANIMALS = ['🐶', '🐱', '🐭', '🐹', '🐰', '🐻', '🐼', '🐨'], BOMB = '💣';

        function initGame() {
            score = 0; combo = 0; maxCombo = 0; moves = 0;
            selectedTile = null; canClick = true; timer = 0;
            lastMatchTime = 0; bombPositions = []; matchCountSinceBomb = 0;
            if (comboTimeout) clearTimeout(comboTimeout);
            if (timerInterval) clearInterval(timerInterval);
            tiles = [];
            for (var i = 0; i < GRID_SIZE; i++) {
                tiles.push(Math.floor(Math.random() * ANIMALS.length));
            }
            if (gameMode === 'time') { timer = TIME_LIMIT; startTimer(); }
            if (gameMode === 'score') startTime = Date.now();
            updateWarningBox(); renderGrid(); updateScore();
        }

        function selectMode(mode) {
            gameMode = mode;
            document.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active'); });
            event.target.classList.add('active');
            initGame();
        }

        function updateWarningBox() {
            document.getElementById('warningBox').style.display = bombPositions.length > 0 ? 'block' : 'none';
        }

        function startTimer() {
            timerInterval = setInterval(function() {
                timer--;
                updateScore();
                if (timer <= 0) { clearInterval(timerInterval); endGame(); }
            }, 1000);
        }

        function renderGrid() {
            var grid = document.getElementById('grid');
            grid.innerHTML = '';
            tiles.forEach(function(animalIndex, index) {
                var tile = document.createElement('button');
                tile.className = 'tile';
                if (bombPositions.indexOf(index) !== -1) {
                    tile.textContent = BOMB;
                    tile.classList.add('bomb');
                } else {
                    tile.textContent = ANIMALS[animalIndex];
                }
                tile.type = 'button';
                tile.onclick = function() { selectTile(index); };
                grid.appendChild(tile);
            });
        }

        function getNeighbors(index) {
            var row = Math.floor(index / 4), col = index % 4, neighbors = [];
            if (row > 0) neighbors.push(index - 4);
            if (row < 3) neighbors.push(index + 4);
            if (col > 0) neighbors.push(index - 1);
            if (col < 3) neighbors.push(index + 1);
            return neighbors;
        }

        function areNeighbors(i1, i2) {
            return getNeighbors(i1).indexOf(i2) !== -1;
        }

        function getComboMultiplier(c) {
            if (c >= 11) return 3;
            if (c >= 6) return 2;
            if (c >= 2) return 1.5;
            return 1;
        }

        function updateComboDisplay() {
            var mult = document.getElementById('comboMultiplier');
            var extra = document.getElementById('extraValue');
            extra.textContent = combo;
            if (combo >= 2) {
                mult.textContent = 'x' + getComboMultiplier(combo) + ' 倍';
                extra.classList.add('combo-active');
            } else {
                mult.textContent = '';
                extra.classList.remove('combo-active');
            }
        }

        function startComboTimer() {
            if (comboTimeout) clearTimeout(comboTimeout);
            comboTimeout = setTimeout(function() { combo = 0; updateComboDisplay(); }, COMBO_TIME_LIMIT);
        }

        function spawnBombs() {
            var bombCount = Math.min(8, Math.floor(combo / 4));
            if (bombCount === 0) return;
            
            var empty = [];
            for (var i = 0; i < GRID_SIZE; i++) {
                if (bombPositions.indexOf(i) === -1) empty.push(i);
            }
            
            for (var i = 0; i < bombCount && empty.length > 0; i++) {
                var idx = Math.floor(Math.random() * empty.length);
                bombPositions.push(empty[idx]);
                empty.splice(idx, 1);
            }
            matchCountSinceBomb = 0;
            updateWarningBox(); renderGrid();
        }

        function selectTile(index) {
            if (!canClick) return;
            if (bombPositions.indexOf(index) !== -1) {
                endGameByBomb(); return;
            }
            var tileElements = document.getElementById('grid').children;
            if (selectedTile === null) {
                selectedTile = index;
                tileElements[index].classList.add('selected');
            } else if (selectedTile === index) {
                tileElements[index].classList.remove('selected');
                selectedTile = null;
            } else {
                if (!areNeighbors(selectedTile, index)) {
                    tileElements[selectedTile].classList.remove('selected');
                    selectedTile = index;
                    tileElements[index].classList.add('selected');
                    return;
                }
                moves++;
                if (tiles[selectedTile] === tiles[index]) {
                    canClick = false;
                    var currentTime = Date.now();
                    if (lastMatchTime === 0 || (currentTime - lastMatchTime) <= COMBO_TIME_LIMIT) {
                        combo++;
                    } else {
                        combo = 1;
                    }
                    lastMatchTime = currentTime;
                    maxCombo = Math.max(maxCombo, combo);
                    score += Math.floor(10 * getComboMultiplier(combo));
                    startComboTimer();
                    tileElements[selectedTile].classList.add('matched');
                    tileElements[index].classList.add('matched');
                    var idx1 = selectedTile, idx2 = index;
                    matchCountSinceBomb++;
                    
                    if (combo > 0 && combo % 4 === 0) {
                        spawnBombs();
                    }
                    
                    if (matchCountSinceBomb >= 2 && bombPositions.length > 0) {
                        bombPositions = [];
                        updateWarningBox();
                    }
                    
                    setTimeout(function() {
                        tiles[idx1] = Math.floor(Math.random() * ANIMALS.length);
                        tiles[idx2] = Math.floor(Math.random() * ANIMALS.length);
                        
                        console.log('消除後檢查是否有可移動...');
                        var hasMove = hasValidMoves();
                        console.log('檢查結果:', hasMove);
                        
                        if (!hasMove) {
                            console.log('觸發洗牌!');
                            shuffleBoard();
                        } else {
                            renderGrid();
                        }
                        
                        if (gameMode === 'score' && score >= SCORE_TARGET) {
                            timer = Math.floor((Date.now() - startTime) / 1000);
                            endGame();
                        } else {
                            canClick = true;
                        }
                    }, 500);
                } else {
                    combo = 0; updateComboDisplay();
                    tileElements[selectedTile].classList.remove('selected');
                }
                selectedTile = null;
                updateScore();
            }
        }

        function hasValidMoves() {
            // 檢查每個格子是否有相鄰的相同動物可以配對
            for (var i = 0; i < GRID_SIZE; i++) {
                // 跳過炸彈格子
                if (bombPositions.indexOf(i) !== -1) continue;
                
                var neighbors = getNeighbors(i);
                for (var j = 0; j < neighbors.length; j++) {
                    var neighborIdx = neighbors[j];
                    // 檢查鄰居也不是炸彈,且動物相同
                    if (bombPositions.indexOf(neighborIdx) === -1) {
                        if (tiles[i] === tiles[neighborIdx]) {
                            console.log('找到可消除配對: 位置', i, '和', neighborIdx, '動物:', ANIMALS[tiles[i]]);
                            return true;
                        }
                    }
                }
            }
            console.log('沒有可消除的配對,準備洗牌');
            return false;
        }

        function shuffleBoard() {
            console.log('執行洗牌! 當前分數:', score);
            score += 500;
            
            // 清除所有炸彈
            bombPositions = [];
            matchCountSinceBomb = 0;
            
            // 重新生成所有動物(不包含炸彈)
            for (var i = 0; i < GRID_SIZE; i++) {
                tiles[i] = Math.floor(Math.random() * ANIMALS.length);
            }
            
            // 確保洗牌後有可消除的配對
            var maxAttempts = 10;
            var attempts = 0;
            while (!hasValidMoves() && attempts < maxAttempts) {
                for (var i = 0; i < GRID_SIZE; i++) {
                    tiles[i] = Math.floor(Math.random() * ANIMALS.length);
                }
                attempts++;
            }
            
            lastMatchTime = Date.now();
            startComboTimer();
            updateWarningBox();
            renderGrid();
            updateScore();
            console.log('洗牌完成! 新分數:', score);
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
            document.getElementById('moves').textContent = moves;
            updateComboDisplay();
        }

        function endGameByBomb() {
            canClick = false;
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('gameOverTitle').textContent = '💥 踩到炸彈!';
            document.getElementById('gameOverStats').innerHTML = '最終分數: <strong>' + score + '</strong><br>連擊: ' + maxCombo + 'x';
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverModal').classList.add('show');
        }

        function endGame() {
            canClick = false;
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('gameOverTitle').textContent = '🎉 遊戲結束!';
            document.getElementById('gameOverStats').innerHTML = '最終分數: <strong>' + score + '</strong><br>連擊: ' + maxCombo + 'x';
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverModal').classList.add('show');
        }

        function closeGameOver() {
            document.getElementById('gameOverModal').classList.remove('show');
            newGame();
        }

        function newGame() { initGame(); }

        async function submitScore() {
            var name = document.getElementById('playerName').value.trim();
            if (!name) { alert('請輸入名字!'); return; }
            try {
                await window.storage.set('leaderboard_' + gameMode + ':' + Date.now(), JSON.stringify({
                    name: name, score: score, moves: moves, combo: maxCombo
                }));
                alert('分數已提交!');
            } catch (e) { alert('提交失敗'); }
        }

        async function showLeaderboard() {
            document.getElementById('leaderboardModal').classList.add('show');
        }

        function closeLeaderboard() {
            document.getElementById('leaderboardModal').classList.remove('show');
        }

        async function switchLeaderboard(mode) {
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            event.target.classList.add('active');
        }

        initGame();
    </script>
</body>
</html>
